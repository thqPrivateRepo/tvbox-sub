name: TVBox Source Merger

on:
  schedule:
    # 每3天检测一次，北京时间凌晨2点（= UTC 18:00）
    - cron: '0 18 */3 * *'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests

      - name: Run merge
        run: python merge.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: merge $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi

    
